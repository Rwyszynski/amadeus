<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BTR Form</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<h1>Business Trip Request Form</h1>

<form th:action="@{/btr/submit}" th:object="${btr}" method="post">
    <!-- Title -->
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" />
    </div>

    <!-- Trip Reason -->
    <div>
        <label for="tripReason">Trip Reason:</label>
        <input type="text" id="tripReason" th:field="*{tripReason}" />
    </div>

    <!-- Start Date -->
    <div>
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" th:field="*{startDate}" />
    </div>

    <!-- End Date -->
    <div>
        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" th:field="*{endDate}" />
    </div>

    <!-- Start Location -->
    <div>
        <label for="startLocation">Start Location:</label>
        <input type="text" id="startLocation" th:field="*{startLocation}" />
    </div>

    <!-- Destination -->
    <div>
        <label for="destination">Destination:</label>
        <input type="text" id="destination" th:field="*{destination}" />
    </div>

    <!-- Anticipated Expense Amount -->
    <div>
        <label for="anticipatedExpenseAmount">Anticipated Expense Amount:</label>
        <input type="number" step="0.01" id="anticipatedExpenseAmount" th:field="*{anticipatedExpenseAmount}" />
    </div>

    <!-- Comments -->
    <div>
        <label for="comments">Comments:</label>
        <textarea id="comments" th:field="*{comments}"></textarea>
    </div>

    <!-- Submit button -->
    <div>
        <button type="submit">Submit</button>
    </div>
</form>
</body>
</html>
