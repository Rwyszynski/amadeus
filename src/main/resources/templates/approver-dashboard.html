<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Approver Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1>Business Trip Requests</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Reason</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Start Location</th>
        <th>Destination</th>
        <th>Expense</th>
        <th>Comments</th>
        <th>User</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="request : ${requests}">
        <td th:text="${request.btrId}"></td>
        <td th:text="${request.title}"></td>
        <td th:text="${request.tripReason}"></td>
        <td th:text="${request.startDate}"></td>
        <td th:text="${request.endDate}"></td>
        <td th:text="${request.startLocation}"></td>
        <td th:text="${request.destination}"></td>
        <td th:text="${request.anticipatedExpenseAmount}"></td>
        <td th:text="${request.comments}"></td>
        <td th:text="${request.userName}"></td>
        <td th:text="${request.status}"></td>
        <td>
            <!-- teraz wywołuje REST endpoint -->
            <a th:href="@{/v1/btr/btr/approve/{id}(id=${request.btrId})}">Approve</a> |
            <a th:href="@{/v1/btr/btr/reject/{id}(id=${request.btrId})}">Reject</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
