<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header fragment -->
<th:block th:replace="fragments/header :: header"></th:block>

<h2>Admin Dashboard</h2>

<h3>All Users</h3>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Username</th>
        <th>Roles</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.emailAddress}"></td>
        <td th:text="${user.userName}"></td>
        <td>
            <!-- Wyświetlenie aktualnych ról -->
            <span th:each="role : ${user.userType}" th:text="${role.name()} + ' '"></span>
        </td>
        <td>
            <!-- Dropdown do dodawania roli -->
            <select th:id="'role-select-' + ${user.id}">
                <option th:each="role : ${T(com.example.amdaeus.entity.Role).values()}"
                        th:value="${role.name()}"
                        th:text="${role.name()}"
                        th:disabled="${user.userType.contains(role)}">
                </option>
            </select>
            <button type="button" th:onclick="'addRole(' + ${user.id} + ')'">Add Role</button>
        </td>
    </tr>
    </tbody>
</table>

<!-- Footer fragment -->
<th:block th:replace="fragments/footer :: footer"></th:block>

<script>
    function addRole(userId) {
        const select = document.getElementById(`role-select-${userId}`);
        const selectedRole = select.value;

        if (!selectedRole) {
            alert('Please select a role.');
            return;
        }

        // Wersja frontend-only: fetch pod faktyczny URL backendu
        // Zakładamy, że Twój backend ma endpoint np. /v1/users/{id}/roles
        fetch(`/v1/users/${userId}/roles`, {  // <- zmień tu tylko URL na swój istniejący endpoint
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            credentials: 'same-origin', // jeśli używasz sesji loginowej
            body: JSON.stringify([selectedRole])
        })
            .then(response => {
                if(response.ok) {
                    alert('Role added successfully!');
                    location.reload(); // odśwież tabelę z nowymi rolami
                } else {
                    response.json().then(data => {
                        alert('Failed to add role: ' + (data.message || JSON.stringify(data)));
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding role.');
            });
    }
</script>

</body>
</html>
