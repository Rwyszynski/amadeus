<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 15px; }
        .success { color: green; margin-top: 10px; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>

<h2>Rejestracja użytkownika</h2>

<div id="message"></div>

<form id="registerForm">
    <label for="firstName">Imię:</label>
    <input type="text" id="firstName" required>

    <label for="lastName">Nazwisko:</label>
    <input type="text" id="lastName" required>

    <label for="emailAddress">Email:</label>
    <input type="email" id="emailAddress" required>

    <label for="userName">Nazwa użytkownika:</label>
    <input type="text" id="userName" required>

    <label for="password">Hasło:</label>
    <input type="password" id="password" required>

    <button type="submit">Zarejestruj</button>
</form>

<p>Masz już konto? <a th:href="@{/login}">Zaloguj się</a></p>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            emailAddress: document.getElementById('emailAddress').value,
            userName: document.getElementById('userName').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            const messageDiv = document.getElementById('message');
            if (response.ok) {
                messageDiv.innerHTML = '<p class="success">' + result.message + '</p>';
            } else {
                messageDiv.innerHTML = '<p class="error">' + result.message + '</p>';
            }
        } catch (err) {
            console.error(err);
            document.getElementById('message').innerHTML = '<p class="error">Błąd podczas rejestracji</p>';
        }
    });
</script>

</body>
</html>
